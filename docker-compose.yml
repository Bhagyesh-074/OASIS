services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
  dashboard:
    build:
      context: ./frontend
      args:
        VITE_OASIS_API_KEY: ${OASIS_API_KEY:-dev-local-key}
    ports: ["5173:80"]
    depends_on: [api]
