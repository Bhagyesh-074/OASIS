name: OASIS CI

on:
  push:
    branches: [main, master, vidish-integration, "feat/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-type:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src/oasis

  backend-tests:
    name: Offline Test Suite & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download spaCy and embeddings models
        run: |
          uv run python -m spacy download en_core_web_sm
          uv run python -c "from sentence_transformers import SentenceTransformer as S; S('all-MiniLM-L6-v2')"

      - name: Run offline tests with FakeLLM
        run: |
          uv run pytest -v \
            tests/contract/ \
            tests/unit/ \
            tests/integration/ \
            tests/invariant/

      - name: Run Replay Purity Invariant Test (FR-30)
        run: |
          uv run pytest -v tests/invariant/eval/test_replay_purity.py

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit & integration tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
