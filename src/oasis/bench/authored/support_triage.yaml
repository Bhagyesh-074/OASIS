    - Determine that warranty coverage is void under Section 4.5 liquid ingress exclusion
    - Reject full warranty replacement claim while explaining the physical evidence clearly
    - Offer the customer the Section 5.2 out-of-warranty repair option with 25 percent discount
    - Provide itemized repair quote and clear instructions for approving work authorization
