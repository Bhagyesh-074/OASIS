    Severity Assessment: Critical (CVSS 9.8).
    Reported Vector: Buffer overflow in open-source edge proxy library (Component: ProxyCore v2.4.1).
    Exploitability: Remote, unauthenticated HTTP header parsing flaw allowing arbitrary shell payload execution.
    Proof of Concept: Verified by internal security research team in isolated staging sandbox.
    
    Production Footprint:
