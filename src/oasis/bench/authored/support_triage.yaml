# Complexity Rubric for support_triage:
# - low (7 tasks): One step, one skill. Straightforward categorization, metadata extraction, or direct rule application.
# - medium (7 tasks): Moderate multi-step workflow. Coordination or synthesis across 2-3 steps or skills (e.g. cross-referencing logs with policy, resolving billing disputes, multi-issue triage).
# - high (6 tasks): Several dependent steps, different skills, conflict resolution, technical root-cause investigation, or multi-stakeholder incident management.

- task_id: support_triage_001
  statement: |
    Classify the priority level and target engineering queue for the inbound customer bug report below according to standard triage guidelines.
    
    ### CONTEXT
    Inbound Ticket #8841:
    User states: When I click the user profile icon on the top navigation bar, the dropdown menu fails to display my uploaded avatar image, showing a broken placeholder square instead. The rest of the profile dropdown works fine and links navigate correctly. Browser is Chromium on desktop Linux.
    
    Triage Guidelines:
    - P1 (Critical): System-wide outage, data loss, or core transactional path blocked. Queue: SRE / Infrastructure.
    - P2 (Major): High-impact functional regression affecting multiple users with no workaround. Queue: Core Backend.
    - P3 (Normal): Minor visual defect, cosmetic UI bug, or localized inconvenience with functional workaround. Queue: Frontend UI.
    - P4 (Low): Cosmetic suggestion, typo in documentation, or non-functional polish. Queue: Product Documentation.
  reference_answer: |
    - Assign ticket priority level P3 Normal based on localized cosmetic UI impact
    - Route ticket to the Frontend UI engineering queue
    - Note reproduction details including Chromium browser on desktop Linux environment
    - Confirm that the defect does not block navigation or core account functionality
  complexity_label: low

