    ### CONTEXT
    Incident Forensic Case #9940:
    Environment: Global Inventory Synchronization Pipeline
    Nodes: Primary Node (US-East), Replica Node A (EU-Central), Replica Node B (AP-South).
    
    Incident Telemetry:
    - Migration script v4.12.0 executed at 01:00 UTC adding column 'inventory_reserve_lock'.
    - US-East and EU-Central applied migration successfully.
    - AP-South failed migration at step 3 due to duplicate index constraint error, entering silent desynchronization.
    - For 4 hours, AP-South processed 3,400 inventory updates using fallback schema v4.11.0, failing to record reservation locks.
    - Result: 85 inventory SKUs in AP-South are currently double-allocated across regional fulfillment centers.
  reference_answer: |
    - Halt incoming transactional write traffic on the desynchronized AP-South regional node
    - Identify specific failure mechanism as duplicate index constraint collision during v4.12.0 migration
    - Isolate the 85 double-allocated inventory SKUs and freeze associated fulfillment dispatch queues
    - Reject full database rollback to prevent losing 4 hours of valid global transactions on other nodes
    - Author forward-patch remediation script to repair index conflict and apply schema v4.12.0 on AP-South
    - Execute transaction reconciliation script comparing node logs to correct reservation lock states
    - Compose technical incident debrief for engineering leadership and customer operations teams
  complexity_label: high

- task_id: support_triage_017
