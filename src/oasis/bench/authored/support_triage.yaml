- task_id: support_triage_009
  statement: |
    Triage an intermittent webhook delivery failure report, identify the underlying HTTP configuration error from the payload logs, and provide developer remediation steps.
    
    ### CONTEXT
    Support Ticket #6620:
    Customer: CloudMetrics Integration Team
    Report: Inbound webhooks from your notification service started failing intermittently with error status around 30 percent of the time over the past 48 hours.
    
    Attached Dispatch Logs:
    Dispatch Attempt 1: Endpoint returns HTTP 200 OK (Latency: 120ms).
    Dispatch Attempt 2: Endpoint returns HTTP 429 Too Many Requests (Response Header: Retry-After: 60, Body: 'Rate limit of 10 requests per second exceeded').
    Dispatch Attempt 3: Endpoint returns HTTP 429 Too Many Requests.
    Dispatch Attempt 4: Endpoint returns HTTP 200 OK after customer queue cleared.
    
    Platform Webhook Spec:
    Default dispatch concurrency is up to 25 simultaneous webhook threads per tenant unless custom concurrency throttling is enabled in webhook settings.
  reference_answer: |
    - Diagnose the root cause as HTTP 429 rate limiting enforced by the customer endpoint
    - Identify customer endpoint capacity limit of 10 requests per second being exceeded by 25 concurrent threads
    - Instruct the customer to configure outbound concurrency throttling in their webhook settings
    - Recommend customer implement queue buffering or increase endpoint rate limits to absorb bursts
    - Confirm that webhook dispatch service is functioning normally and respecting backoff
  complexity_label: medium

- task_id: support_triage_010
  statement: |
    Evaluate the suspicious account activity alerts, determine if an unauthorized account compromise occurred, apply safety protocol actions, and outline recovery instructions.
    
    ### CONTEXT
    Security Alert Incident #7712:
    Target Account: DevLead-User-84
    Timeline:
    - 14:02 UTC: Successful session login from City Alpha (User habitual location, Known device macOS).
    - 14:18 UTC: Password change request initiated and confirmed via recovery email.
    - 14:22 UTC: Successful login from City Beta (Distance: 6,500 km, Unknown Linux device, Unrecognized VPN IP).
    - 14:25 UTC: New API full-access key generated and downloaded from City Beta session.
    
    Compromise Protocol:
    1. If a session originating from an unrecognized IP and impossible travel distance generates credentials immediately following a password change, flag as High-Confidence Compromise.
    2. Immediately revoke all active sessions and disable all API keys generated within the last 24 hours.
    3. Place account in suspended recovery status and initiate mandatory identity re-verification.
  reference_answer: |
    - Classify incident as high-confidence account compromise due to impossible travel and unauthorized API key generation
    - Execute immediate revocation of all active user sessions across all devices
    - Invalidate and delete the newly generated API full-access key
    - Place the account into temporary security quarantine status
    - Formulate user remediation checklist including credential reset and mandatory identity re-verification
  complexity_label: medium

