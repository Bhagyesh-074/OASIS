    - 40 percent run modern ProxyCore v3.1.0 which is immune to this vulnerability.
    - Vendor has not released a public patch; estimated upstream fix timeline is 72 hours.
    
    Emergency Vulnerability Protocol:
    1. Assess whether WAF rules or reverse-proxy filters can block exploit patterns without downtime.
    2. Maintain strict embargo on public disclosure until customer defensive mitigations are active.
    3. Deploy hotfix configuration or mitigation rule across managed infrastructure within 2-hour SLA.
  reference_answer: |
    - Classify vulnerability severity as Critical CVSS 9.8 Remote Code Execution
    - Map production attack surface identifying 60 percent of edge routers running vulnerable v2.4.1
    - Formulate and test custom WAF payload inspection filter to drop malicious header patterns
    - Deploy emergency WAF mitigation rule across all managed edge nodes within 2-hour SLA
    - Maintain strict confidential disclosure embargo to prevent exploit weaponization
    - Author private emergency security bulletin for enterprise self-hosted customers with mitigation steps
    - Establish tracking matrix for verified customer patch adoption prior to public advisory
  complexity_label: high

- task_id: support_triage_018
  statement: |
    Audit six months of chronic service degradation against an enterprise Master Services Agreement (MSA), reconcile engineering performance data with commercial sales promises, and formulate a structured settlement plan.
    
    ### CONTEXT
    Commercial Escalation #8872:
    Customer: Global Logistics Enterprise Corp
    Contract: Annual Value $600,000 ($50,000 monthly).
    Commitment: 99.95 percent monthly uptime measured per calendar month.
    Breach Clause: 10 percent credit for uptime between 99.5% and 99.95%; 25 percent credit for uptime between 99.0% and 99.5%; 50 percent credit below 99.0%.
    
    Audit Findings Over Past 6 Months:
    - Month 1: 99.98% (No breach)
    - Month 2: 99.40% (Outage duration: 4.3 hours) -> 25% credit tier
    - Month 3: 99.96% (No breach)
    - Month 4: 98.80% (Outage duration: 8.6 hours) -> 50% credit tier
    - Month 5: 99.60% (Outage duration: 2.9 hours) -> 10% credit tier
    - Month 6: 99.97% (No breach)
    Customer demands immediate 100 percent refund of all 6 months ($300,000) or threatens legal termination.
    Sales team informally promised an ad-hoc 99.99 percent uptime SLA during renewal talks.
    Executive leadership authorizes offering up to a $20,000 renewal discount alongside contractual credits to secure contract extension.
  reference_answer: |
    - Calculate exact contractual service credits for Month 2 ($12,500), Month 4 ($25,000), and Month 5 ($5,000)
    - Determine total contractual SLA credit liability of $42,500 under the legally binding MSA
    - Reject customer demand for $300,000 full refund as inconsistent with contractual breach clauses
    - Clarify that informal sales verbal promises do not supersede written MSA terms
    - Propose a commercial settlement combining $42,500 contractual credits plus $20,000 renewal discount
    - Note that Months 1, 3 and 6 had no breach (99.98, 99.96, 99.97 percent) and earn no credit
    - Draft formal executive mediation briefing for legal counsel and executive leadership
  complexity_label: high

