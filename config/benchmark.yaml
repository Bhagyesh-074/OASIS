# OASIS Benchmark Configuration (FR-3, NFR-4)
# Configures dataset ingestion, per-domain sample counts, seeded determinism, and calibration/eval splits.

seed: 42

# Fraction of tasks partitioned into the held-out calibration split (FR-3)
# The remaining tasks are assigned to the evaluation split ('eval')
calibration_fraction: 0.25

# Target task counts per domain (default 20)
domain_counts:
  code_generation: 20
  research_qa: 20
  quant_analysis: 20
  support_triage: 20
  content_generation: 20

# Allocation of tasks across benchmark data sources within each domain
source_allocation:
  code_generation:
    mbpp: 10
    humaneval: 10
  research_qa:
    hotpotqa: 20
  quant_analysis:
    gsm8k: 20
  support_triage:
    authored: 20
  content_generation:
    authored: 20

# HuggingFace datasets specifications for live ingestion
datasets:
  mbpp:
    path: "google-research-datasets/mbpp"
    name: "sanitized"
    split: "test"
    revision: "4bb6404fdc6cacfda99d4ac4205087b89d32030c"
  humaneval:
    path: "openai/openai_humaneval"
    split: "test"
    revision: "7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544"
  hotpotqa:
    path: "hotpotqa/hotpot_qa"
    name: "distractor"
    split: "validation"
    revision: "1908d6afbbead072334abe2965f91bd2709910ab"
  gsm8k:
    path: "openai/gsm8k"
    name: "main"
    split: "test"
    revision: "740312add88f781978c0658806c59bc2815b9866"

# Output destination for ingested task records
output_path: "data/tasks.jsonl"
